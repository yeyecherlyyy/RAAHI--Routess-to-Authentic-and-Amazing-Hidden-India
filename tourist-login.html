<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — RAAHI</title>
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">
</head>
<body>
  <div class="auth-page">
    <div class="auth-left">
      <div style="text-align:center;max-width:360px;">
        <div style="font-size:4rem;margin-bottom:24px;">🗺️</div>
        <h2>Discover India's<br><span class="text-accent">Hidden Treasures</span></h2>
        <p style="color:var(--text-secondary);margin-top:16px;line-height:1.7;">Join thousands of explorers finding the India that guidebooks miss.</p>
        <div style="display:flex;gap:32px;justify-content:center;margin-top:32px;">
          <div><h3 style="color:var(--primary);font-size:1.5rem;">2,400+</h3><p style="font-size:0.8rem;color:var(--text-muted);">Hidden Gems</p></div>
          <div><h3 style="color:var(--secondary);font-size:1.5rem;">26</h3><p style="font-size:0.8rem;color:var(--text-muted);">States</p></div>
          <div><h3 style="color:var(--primary);font-size:1.5rem;">380</h3><p style="font-size:0.8rem;color:var(--text-muted);">Guides</p></div>
        </div>
      </div>
    </div>
    <div class="auth-right">
      <div class="auth-form" id="auth-form"></div>
    </div>
  </div>
  <script type="module" src="/src/js/pages/touristAuth.js"></script>
</body>
</html>
