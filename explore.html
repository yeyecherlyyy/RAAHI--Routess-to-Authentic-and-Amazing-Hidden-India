<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Map — RAAHI</title>
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">
</head>
<body>
  <div style="padding-top:var(--nav-height);">
    <div class="explore-layout">
      <div class="explore-sidebar">
        <div class="search-bar" style="margin-bottom:16px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="search-input" placeholder="Search city or gem...">
        </div>
        <div class="filter-bar" id="filter-bar" style="margin-bottom:16px;"></div>
        <div id="gem-list"></div>
      </div>
      <div class="explore-map-area">
        <div id="explore-map"></div>
        <div class="vibe-search">
          <span style="font-size:1.2rem;">✨</span>
          <input type="text" id="genie-input" placeholder="Describe your vibe..." onkeyup="if(event.key==='Enter')document.getElementById('genie-btn').click()">
          <button class="btn btn-primary" id="genie-btn" style="border-radius:var(--radius-full);padding:10px 20px;">Gem Genie</button>
        </div>
        <div id="genie-results" style="display:none;position:absolute;bottom:80px;left:50%;transform:translateX(-50%);width:420px;max-width:90%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);z-index:999;max-height:360px;overflow-y:auto;"></div>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="/src/js/pages/explore.js"></script>
</body>
</html>
